[project]
name = "deep-learning-project-1"
version = "0.1.0"
description = "Minecraft Mob Vision - CV model for mob classification and bounding box prediction"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.13.0",
    "torchvision>=0.27.0",
    "timm==1.0.27",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "numpy>=2.4.6",
    "tqdm>=4.67.0",
    "triton-windows>=3.7,<3.8 ; sys_platform == 'win32'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "TCH", "ANN", "RUF", "B"]

[tool.pyrefly]
search_path = ["."]

[dependency-groups]
dev = [
    "pyrefly>=1.0.0",
    "ruff>=0.15.17",
]
notebook = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
]
